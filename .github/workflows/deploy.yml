name: Build e Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/dayvsonmarques/barbershop:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disparar deploy no Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          # Remove espaços/quebras de linha colados junto com os secrets
          TOKEN=$(printf '%s' "$COOLIFY_TOKEN" | tr -d '[:space:]')
          URL=$(printf '%s' "$COOLIFY_WEBHOOK_URL" | tr -d '[:space:]')
          # Exibe a resposta do Coolify para facilitar o diagnóstico em caso de erro
          curl -sSL --fail-with-body -H "Authorization: Bearer $TOKEN" "$URL"
